name: Build Balcones League APK

on:
  push:
    branches: [main]
    paths:
      - 'balcones-league/index.html'
      - 'balcones-league/manifest.webmanifest'
      - 'balcones-league/assets/**'
      - 'balcones-league/android-app/**'
      - 'balcones-league/download/index.html'
      - '.github/workflows/balcones-league-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Balcones League v2.5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('balcones-league/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, flags=re.I)
          if not scripts:
              raise SystemExit('no inline scripts found')
          for i, script in enumerate(scripts):
              Path(f'/tmp/bl-inline-{i}.js').write_text(script, encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for script in /tmp/bl-inline-*.js; do
            node --check "$script"
          done

          grep -q "game.id==='28'.*max:28,target:28" balcones-league/index.html
          grep -q "game.id==='triples'.*max:22,target:22" balcones-league/index.html
          grep -q "game.id==='tiros_libres'.*max:6,target:6" balcones-league/index.html
          grep -q 'ftAttemptsByPlayer' balcones-league/index.html
          grep -q 'ftTiebreak' balcones-league/index.html
          grep -q 'blHandleAndroidBack' balcones-league/index.html
          grep -q 'android:screenOrientation="portrait"' balcones-league/android-app/app/src/main/AndroidManifest.xml
          grep -q 'SCREEN_ORIENTATION_PORTRAIT' balcones-league/android-app/app/src/main/java/com/balconesleague/app/MainActivity.java
          grep -q "versionCode 8" balcones-league/android-app/app/build.gradle
          grep -q "versionName '2.5'" balcones-league/android-app/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode balcones-league/signing/keystore.b64 > /tmp/balcones-league-release.jks

      - name: Copy web app into Android assets
        shell: bash
        run: |
          set -euo pipefail
          ASSETS='balcones-league/android-app/app/src/main/assets'
          find "$ASSETS" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          mkdir -p "$ASSETS/assets"
          cp balcones-league/index.html "$ASSETS/index.html"
          cp balcones-league/manifest.webmanifest "$ASSETS/manifest.webmanifest"
          cp -R balcones-league/assets/. "$ASSETS/assets/"

      - name: Build signed release APK
        working-directory: balcones-league/android-app
        env:
          BL_KEYSTORE_FILE: /tmp/balcones-league-release.jks
          BL_KEYSTORE_PASSWORD: ${{ secrets.BL_KEYSTORE_PASSWORD }}
          BL_KEY_ALIAS: balconesleague
          BL_KEY_PASSWORD: ${{ secrets.BL_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BL_KEYSTORE_PASSWORD"
          gradle --no-daemon :app:assembleRelease

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='balcones-league-v2.5'
          APK='balcones-league/android-app/app/build/outputs/apk/release/app-release.apk'
          cp "$APK" /tmp/Balcones-League-v2.5.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/Balcones-League-v2.5.apk --clobber
          else
            gh release create "$TAG" /tmp/Balcones-League-v2.5.apk \
              --title 'Balcones League v2.5' \
              --notes '28 llega a 28 puntos; Triples llega a 22. Tiros libres llega a 6, registra 6 de cuántos y suma los tiros de desempate al resultado y las estadísticas.'
          fi

      - name: Publish direct APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p balcones-league/download
          cp balcones-league/android-app/app/build/outputs/apk/release/app-release.apk balcones-league/download/Balcones-League.apk
          cp balcones-league/android-app/app/build/outputs/apk/release/app-release.apk balcones-league/download/Balcones-League-v2.5.apk

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add balcones-league
          if ! git diff --cached --quiet; then
            git commit -m 'Balcones League v2.5 Android + APK [skip ci]'
            git push
          fi
